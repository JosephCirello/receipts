<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Receipts logo directions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1920px; height: 1080px; font-family: Inter, sans-serif; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; background: #fffdf8; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; border: 1px solid #ece7dc; color: #14213d; }
  .cell svg { width: 190px; height: 190px; }
  .word { font-weight: 900; font-size: 64px; letter-spacing: -.05em; line-height: 1; }
  .n { font-weight: 800; font-size: 20px; color: #6b7690; letter-spacing: .06em; text-transform: uppercase; }
</style></head><body>

<div class="cell"><div class="n">1 · the stamp</div>

  <div class="word">Receipts</div></div>

<div class="cell"><div class="n">2 · the shield</div>

  <div class="word">Receipts</div></div>

<div class="cell"><div class="n">4 · the R</div>

  <div class="word">Receipts</div></div>

<div class="cell"><div class="n">6 · the ledger</div>

</body></html>
