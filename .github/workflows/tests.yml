# Runs the README's own quick start on a clean Linux machine at every push:
# install the requirements, run the tests. No keys, no network calls to PayPal or to any model.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the requirements
        run: pip install -r requirements.txt
      - name: Run the tests (no keys, no network)
        run: pytest -q
